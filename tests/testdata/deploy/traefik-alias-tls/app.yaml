apiVersion: shrine/v1
kind: Application
metadata:
  name: whoami-tls
  owner: shrine-alias-test
spec:
  image: traefik/whoami
  port: 80
  replicas: 1
  networking:
    exposeToPlatform: true
  routing:
    domain: whoami-tls.shrine.lab
    aliases:
      - host: alias.shrine.lab
        pathPrefix: /tls
        stripPrefix: false
        tls: true
