apiVersion: shrine/v1
kind: Application
metadata:
  name: api
  owner: shrine-reo
spec:
  image: traefik/whoami
  port: 80
  dependencies:
    - kind: Resource
      name: pg
      owner: shrine-reo
  env:
    - name: DB_NAME
      valueFrom: resource.pg.POSTGRES_DB
    - name: DB_URL
      valueFrom: resource.pg.DB_URL
